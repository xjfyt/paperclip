<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-title" content="Paperclip" />
    <title>Paperclip</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <script>
      // Resolve the language before the first paint so the document never
      // claims "en" while a Chinese/Spanish/Japanese UI is about to render.
      // This mirrors resolveLocale() in ui/src/i18n/preferences.ts; keep the
      // two in sync.
      (() => {
        const storageKey = "paperclip.locale";
        const supported = ["en", "zh-CN", "es", "ja"];
        const normalize = (value) => {
          const locale = String(value ?? "").trim().replace(/_/g, "-").toLowerCase();
          if (!locale) return null;
          if (/^en(?:-|$)/.test(locale)) return "en";
          if (/^es(?:-|$)/.test(locale)) return "es";
          if (/^ja(?:-|$)/.test(locale)) return "ja";
          if (/^zh-(?:cn|hans)(?:-|$)/.test(locale)) return "zh-CN";
          return null;
        };
        let saved = null;
        try { saved = window.localStorage.getItem(storageKey); } catch { /* Storage may be disabled. */ }
        let locale = supported.includes(saved) ? saved : null;
        if (!locale) {
          const languages = Array.isArray(navigator.languages) && navigator.languages.length > 0
            ? navigator.languages
            : [navigator.language];
          for (const candidate of languages) {
            locale = normalize(candidate);
            if (locale) break;
          }
        }
        document.documentElement.lang = locale || "en";
      })();
    </script>
    <script>
      (() => {
        const key = "paperclip.theme";
        const darkThemeColor = "#18181b";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const fallback = prefersDark ? "dark" : "light";
          const theme = stored === "light" || stored === "dark" ? stored : fallback;
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Keep recovery outside #root so it cannot be mistaken for a mounted app.
         It must work even when the app's JavaScript or stylesheet cannot load. -->
    <section id="paperclip-startup" role="status" aria-live="polite" hidden>
      <div class="mx-auto flex min-h-screen max-w-2xl flex-col justify-center space-y-4 px-4 py-10">
        <div>
          <h1 id="paperclip-startup-title" class="text-lg font-semibold">Paperclip couldn’t start</h1>
          <p id="paperclip-startup-message" class="mt-1 text-sm text-muted-foreground">
            Part of the app failed to load. Check your connection and reload this page to try again.
          </p>
        </div>
        <div>
          <button id="paperclip-startup-reload" type="button" class="inline-flex items-center rounded-md border border-input bg-background px-3 py-1.5 text-sm font-medium shadow-sm hover:bg-accent hover:text-accent-foreground">
            Reload page
          </button>
        </div>
      </div>
    </section>
    <script>
      // This guard is deliberately inline and independent of the module graph:
      // React's error boundary cannot catch an import that prevents React loading.
      (() => {
        const root = document.getElementById("root");
        const notice = document.getElementById("paperclip-startup");
        const title = document.getElementById("paperclip-startup-title");
        const message = document.getElementById("paperclip-startup-message");
        const reload = document.getElementById("paperclip-startup-reload");
        const messages = {
          en: {
            failedTitle: "Paperclip couldn’t start",
            failedMessage: "Part of the app failed to load. Check your connection and reload this page to try again.",
            slowTitle: "Paperclip is taking longer to load",
            slowMessage: "You can keep waiting, or reload this page to try again.",
            reload: "Reload page",
          },
          "zh-CN": {
            failedTitle: "Paperclip 未能启动",
            failedMessage: "应用的一部分加载失败。请检查网络连接，然后重新加载此页面。",
            slowTitle: "Paperclip 加载时间较长",
            slowMessage: "你可以继续等待，或重新加载此页面再试一次。",
            reload: "重新加载页面",
          },
          es: {
            failedTitle: "Paperclip no pudo iniciarse",
            failedMessage: "Parte de la aplicación no se cargó. Revisa tu conexión y recarga esta página para intentarlo de nuevo.",
            slowTitle: "Paperclip está tardando más en cargar",
            slowMessage: "Puedes seguir esperando o recargar esta página para intentarlo de nuevo.",
            reload: "Recargar página",
          },
          ja: {
            failedTitle: "Paperclip を起動できませんでした",
            failedMessage: "アプリの一部を読み込めませんでした。接続を確認して、このページを再読み込みしてください。",
            slowTitle: "Paperclip の読み込みに時間がかかっています",
            slowMessage: "このまま待つか、このページを再読み込みしてください。",
            reload: "ページを再読み込み",
          },
        };
        const text = messages[document.documentElement.lang] || messages.en;
        title.textContent = text.failedTitle;
        message.textContent = text.failedMessage;
        reload.textContent = text.reload;
        const retry = () => window.location.reload();
        const finished = () => root.childElementCount > 0;
        const cleanup = () => {
          clearTimeout(timer);
          observer.disconnect();
          window.removeEventListener("error", onError, true);
          window.removeEventListener("unhandledrejection", onFailure);
          reload.removeEventListener("click", retry);
          notice.remove();
        };
        const onFailure = () => {
          if (finished()) return cleanup();
          title.textContent = text.failedTitle;
          message.textContent = text.failedMessage;
          notice.hidden = false;
        };
        const onError = (event) => {
          // Ignore images and other incidental resources. Preserve the original
          // error for the browser console; never display raw errors or URLs here.
          if (event instanceof ErrorEvent || event.target instanceof HTMLScriptElement ||
              (event.target instanceof HTMLLinkElement && event.target.rel === "stylesheet")) onFailure();
        };
        const observer = new MutationObserver(() => { if (finished()) cleanup(); });
        observer.observe(root, { childList: true });
        const timer = setTimeout(() => {
          if (finished()) return cleanup();
          if (!notice.hidden) return;
          title.textContent = text.slowTitle;
          message.textContent = text.slowMessage;
          notice.hidden = false;
        }, 30_000);
        window.addEventListener("error", onError, true);
        window.addEventListener("unhandledrejection", onFailure);
        reload.addEventListener("click", retry);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
